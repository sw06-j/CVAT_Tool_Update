spec:
  description: 커스텀 열화상 데이터셋 전용 YOLOv8 범용 동적 자동 사전 라벨링 추론 모델
  runtime: python:3.10
  handler: main:handler
  eventTimeout: 60s

  build:
    baseImage: ubuntu:22.04
    directives:
      preCopy:
        - kind: RUN
          value: apt update && apt install -y python-is-python3 python3-pip libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu --default-timeout=1000
        - kind: RUN
          value: pip install ultralytics opencv-python-headless pillow pyyaml --default-timeout=1000

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432
        port: 32001

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
